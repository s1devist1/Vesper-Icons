<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>GNOME Text Editor</title>
  <defs>
    <linearGradient id="back" x1="90" y1="50" x2="400" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="page" x1="104" y1="56" x2="400" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29255F"/>
      <stop offset=".45" stop-color="#1A1850"/>
      <stop offset="1" stop-color="#101045"/>
    </linearGradient>
    <linearGradient id="foldA" x1="328" y1="56" x2="408" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".5" stop-color="#FEEC90"/>
      <stop offset="1" stop-color="#D9B85A"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#FEEC90" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#FEEC90" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D9B85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- back sheet, tilted -->
  <g transform="rotate(-9 256 256) translate(-16 8)">
    <path fill="url(#back)" stroke="#E9E6FF" stroke-width="1.5" stroke-linejoin="round"
          d="M140,56 H328 L408,136 V420 c0,22 -18,36 -40,36 H140 c-22,0 -36,-14 -36,-36 V92 c0,-22 14,-36 36,-36 Z"/>
    <rect x="140" y="110" width="110" height="10" rx="5" fill="#756AA5" opacity=".55"/>
    <rect x="140" y="140" width="150" height="10" rx="5" fill="#756AA5" opacity=".4"/>
  </g>

  <!-- front sheet -->
  <path fill="url(#page)" stroke="#756AA5" stroke-width="2" stroke-opacity=".6" stroke-linejoin="round"
        d="M140,56 H328 L408,136 V420 c0,22 -18,36 -40,36 H140 c-22,0 -36,-14 -36,-36 V92 c0,-22 14,-36 36,-36 Z"/>
  <path d="M108,100 c2,-24 16,-40 36,-40 H322" fill="none" stroke="#BCB8E3" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  <!-- folded corner -->
  <path fill="url(#foldA)" stroke="#E9E6FF" stroke-width="1.3" stroke-linejoin="round"
        d="M328,56 V112 c0,14 10,24 24,24 H408 Z"/>

  <!-- text lines -->
  <rect x="140" y="176" width="150" height="16" rx="8" fill="#E6E1F7" opacity=".95"/>
  <rect x="140" y="216" width="228" height="11" rx="5.5" fill="#BCB8E3" opacity=".7"/>
  <rect x="140" y="246" width="196" height="11" rx="5.5" fill="#BCB8E3" opacity=".55"/>
  <rect x="140" y="276" width="216" height="11" rx="5.5" fill="#756AA5" opacity=".8"/>
  <rect x="140" y="306" width="120" height="11" rx="5.5" fill="#756AA5" opacity=".65"/>

  <!-- glowing caret -->
  <ellipse cx="146" cy="372" rx="64" ry="48" fill="url(#aura)"/>
  <rect x="136" y="356" width="34" height="34" rx="14" fill="#FEEC90" opacity=".5" filter="url(#blur)"/>
  <rect x="140" y="350" width="140" height="11" rx="5.5" fill="#BCB8E3" opacity=".55"/>
  <rect x="290" y="340" width="10" height="44" rx="5" fill="url(#amber)"/>
  <rect x="292" y="344" width="3" height="22" rx="1.5" fill="#FFF9D6" opacity=".8"/>
  <ellipse cx="295" cy="362" rx="22" ry="30" fill="url(#aura)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
