<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Bazaar</title>
  <defs>
    <linearGradient id="back" x1="90" y1="60" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="body" x1="96" y1="232" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29255F"/>
      <stop offset=".45" stop-color="#1A1850"/>
      <stop offset="1" stop-color="#101045"/>
    </linearGradient>
    <linearGradient id="stripeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".6" stop-color="#D0CFFE"/>
      <stop offset="1" stop-color="#BCB8E3"/>
    </linearGradient>
    <linearGradient id="stripeD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#756AA5"/>
      <stop offset="1" stop-color="#29255F"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".5" stop-color="#FEEC90"/>
      <stop offset="1" stop-color="#D9B85A"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#FEEC90" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#FEEC90" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D9B85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- back panel, tilted -->
  <rect x="104" y="64" width="304" height="388" rx="40" fill="url(#back)" stroke="#E9E6FF" stroke-width="1.5"
        transform="rotate(-8 256 256) translate(-10 0)"/>

  <!-- stall body -->
  <path fill="url(#body)" stroke="#756AA5" stroke-width="2" stroke-opacity=".6" stroke-linejoin="round"
        d="M96,232 H416 V412 c0,24 -18,40 -42,40 H138 c-24,0 -42,-16 -42,-40 Z"/>

  <!-- goods on the counter -->
  <rect x="124" y="372" width="34" height="34" rx="10" fill="#BCB8E3" opacity=".85"/>
  <rect x="166" y="386" width="26" height="20" rx="7" fill="#756AA5"/>
  <circle cx="352" cy="388" r="18" fill="#D0CFFE" opacity=".9"/>
  <rect x="378" y="380" width="22" height="26" rx="8" fill="#756AA5"/>
  <rect x="96" y="406" width="320" height="16" fill="#BCB8E3" opacity=".25"/>

  <!-- hanging lantern -->
  <path d="M256,232 V270" stroke="#BCB8E3" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="256" cy="312" rx="84" ry="70" fill="url(#aura)"/>
  <rect x="232" y="290" width="48" height="52" rx="16" fill="#FEEC90" opacity=".55" filter="url(#blur)"/>
  <rect x="236" y="268" width="40" height="10" rx="4" fill="#756AA5"/>
  <rect x="234" y="276" width="44" height="60" rx="18" fill="url(#amber)"/>
  <path d="M244,292 c-3,10 -3,22 2,32" stroke="#FFF9D6" stroke-width="4" stroke-linecap="round" fill="none" opacity=".75"/>
  <rect x="240" y="334" width="32" height="8" rx="4" fill="#D9B85A"/>

  <!-- striped scalloped awning -->
  <path fill="url(#stripeL)" stroke="#E9E6FF" stroke-width="1.2" stroke-linejoin="round" d="M124,100 H190 L172,232 A42,28 0 0 1 88,232 Z"/>
  <path fill="url(#stripeD)" stroke="#756AA5" stroke-width="1.2" stroke-linejoin="round" d="M190,100 H256 L256,232 A42,28 0 0 1 172,232 Z"/>
  <path fill="url(#stripeL)" stroke="#E9E6FF" stroke-width="1.2" stroke-linejoin="round" d="M256,100 H322 L340,232 A42,28 0 0 1 256,232 Z"/>
  <path fill="url(#stripeD)" stroke="#756AA5" stroke-width="1.2" stroke-linejoin="round" d="M322,100 H388 L424,232 A42,28 0 0 1 340,232 Z"/>
  <path d="M130,104 H382" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
