<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>OpenCode</title>
  <defs>
    <linearGradient id="back" x1="80" y1="60" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="win" x1="76" y1="76" x2="436" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29255F"/>
      <stop offset=".45" stop-color="#1A1850"/>
      <stop offset="1" stop-color="#101045"/>
    </linearGradient>
    <linearGradient id="mark" x1="176" y1="146" x2="336" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".5" stop-color="#FEEC90"/>
      <stop offset="1" stop-color="#D9B85A"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#FEEC90" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#FEEC90" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D9B85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- back plate, tilted -->
  <rect x="76" y="64" width="360" height="360" rx="76" fill="url(#back)" stroke="#E9E6FF" stroke-width="1.5"
        transform="rotate(-8 256 256) translate(-8 -4)"/>

  <!-- front plate -->
  <rect x="76" y="76" width="360" height="360" rx="76" fill="url(#win)" stroke="#756AA5" stroke-width="2" stroke-opacity=".6"/>
  <path d="M84,170 C90,116 120,84 176,80 H300" fill="none" stroke="#BCB8E3" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- blocky O mark -->
  <rect x="176" y="146" width="160" height="220" rx="24" fill="url(#mark)"/>
  <rect x="210" y="186" width="92" height="140" rx="12" fill="#101045"/>
  <path d="M184,170 C186,158 194,152 206,152 H300" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>

  <!-- glowing core -->
  <ellipse cx="256" cy="262" rx="72" ry="78" fill="url(#aura)"/>
  <rect x="228" y="238" width="56" height="56" rx="12" fill="#FEEC90" opacity=".55" filter="url(#blur)"/>
  <rect x="228" y="236" width="56" height="52" rx="12" fill="url(#amber)"/>
  <rect x="234" y="242" width="24" height="6" rx="3" fill="#FFF9D6" opacity=".85"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
