<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Steam</title>
  <defs>
    <linearGradient id="back" x1="60" y1="60" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="disc" x1="90" y1="90" x2="430" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29255F"/>
      <stop offset=".45" stop-color="#1A1850"/>
      <stop offset="1" stop-color="#101045"/>
    </linearGradient>
    <linearGradient id="mark" x1="130" y1="150" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".5" stop-color="#FEEC90"/>
      <stop offset="1" stop-color="#D9B85A"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#FEEC90" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#FEEC90" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D9B85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- back disc -->
  <circle cx="232" cy="230" r="188" fill="url(#back)" stroke="#E9E6FF" stroke-width="1.5"/>

  <!-- front disc -->
  <circle cx="262" cy="270" r="186" fill="url(#disc)" stroke="#756AA5" stroke-width="2" stroke-opacity=".6"/>
  <path d="M100,214 C124,130 204,86 280,84" fill="none" stroke="#BCB8E3" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- connecting rod and arm -->
  <path d="M126,330 L198,350" stroke="url(#mark)" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M198,346 L304,258" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- small piston -->
  <circle cx="196" cy="352" r="34" fill="url(#mark)"/>
  <circle cx="196" cy="352" r="14" fill="#101045"/>

  <!-- big ring with glowing core -->
  <circle cx="316" cy="214" r="62" fill="url(#aura)"/>
  <circle cx="316" cy="214" r="48" fill="none" stroke="url(#mark)" stroke-width="26"/>
  <circle cx="316" cy="214" r="22" fill="#FEEC90" opacity=".55" filter="url(#blur)"/>
  <circle cx="316" cy="214" r="20" fill="url(#amber)"/>
  <circle cx="309" cy="207" r="5" fill="#FFF9D6" opacity=".9"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
