<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>kitty: terminal</title>
  <defs>
    <linearGradient id="cat" x1="60" y1="70" x2="420" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#756AA5"/>
      <stop offset="1" stop-color="#29255F"/>
    </linearGradient>
    <linearGradient id="fold" x1="56" y1="210" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#756AA5"/>
      <stop offset="1" stop-color="#29255F"/>
    </linearGradient>
    <linearGradient id="win" x1="56" y1="230" x2="420" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29255F"/>
      <stop offset=".45" stop-color="#1A1850"/>
      <stop offset="1" stop-color="#101045"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".5" stop-color="#FEEC90"/>
      <stop offset="1" stop-color="#D9B85A"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#FEEC90" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#FEEC90" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D9B85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="winClip">
      <path d="M56,304 C98,240 158,212 238,208 H414 c24,0 42,18 42,42 V410 c0,24 -18,42 -44,42 H100 C74,452 56,434 56,410 Z"/>
    </clipPath>
  </defs>

  <!-- cat head silhouette behind the window -->
  <path fill="url(#cat)" stroke="#E9E6FF" stroke-width="1.5" stroke-linejoin="round"
        d="M62,210 L72,88 C74,70 88,64 100,74 L172,130 C214,118 298,118 340,130 L412,74 C424,64 438,70 440,88 L450,210 V440 H62 Z"/>
  <!-- inner ears -->
  <path fill="url(#ear)" opacity=".75" d="M92,112 L96,100 L146,138 C124,142 108,150 98,160 Z"/>
  <path fill="url(#ear)" opacity=".75" d="M420,112 L416,100 L366,138 C388,142 404,150 414,160 Z"/>

  <!-- glowing eyes -->
  <ellipse cx="190" cy="168" rx="30" ry="26" fill="url(#aura)"/>
  <ellipse cx="322" cy="168" rx="30" ry="26" fill="url(#aura)"/>
  <ellipse cx="190" cy="168" rx="13" ry="15" fill="url(#amber)"/>
  <ellipse cx="322" cy="168" rx="13" ry="15" fill="url(#amber)"/>
  <ellipse cx="190" cy="169" rx="3.5" ry="11" fill="#101045"/>
  <ellipse cx="322" cy="169" rx="3.5" ry="11" fill="#101045"/>
  <circle cx="185" cy="162" r="3" fill="#FFF9D6" opacity=".9"/>
  <circle cx="317" cy="162" r="3" fill="#FFF9D6" opacity=".9"/>
  <!-- nose + whiskers -->
  <path d="M248,186 h16 l-8,9 z" fill="#29255F" opacity=".8"/>
  <path d="M120,176 h36 M118,192 l34,-4 M392,176 h-36 M394,192 l-34,-4" stroke="#756AA5" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".7"/>

  <!-- terminal window: fold layer + dark front -->
  <path fill="url(#fold)" d="M56,290 C70,236 112,202 170,198 c22,-2 48,-2 70,-2 H414 c24,0 42,18 42,42 V410 c0,24 -18,42 -44,42 H100 C74,452 56,434 56,410 Z"/>
  <path fill="url(#win)" d="M56,304 C98,240 158,212 238,208 H414 c24,0 42,18 42,42 V410 c0,24 -18,42 -44,42 H100 C74,452 56,434 56,410 Z"/>
  <path d="M60,300 C100,240 158,214 238,211 H410" fill="none" stroke="#756AA5" stroke-width="2" stroke-linecap="round" opacity=".6"/>

  <g clip-path="url(#winClip)">
    <!-- cursor glow -->
    <ellipse cx="226" cy="402" rx="60" ry="30" fill="#FEEC90" opacity=".55" filter="url(#blur)"/>
    <ellipse cx="136" cy="366" rx="52" ry="48" fill="url(#aura)"/>
  </g>

  <!-- output lines -->
  <rect x="190" y="246" width="190" height="12" rx="6" fill="#756AA5" opacity=".7"/>
  <rect x="190" y="276" width="124" height="12" rx="6" fill="#BCB8E3" opacity=".45"/>

  <!-- prompt chevron + cursor -->
  <path d="M112,328 L160,366 L112,404" fill="none" stroke="url(#amber)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112,328 L160,366" fill="none" stroke="#FFF9D6" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <rect x="196" y="388" width="52" height="18" rx="5" fill="url(#amber)"/>
  <rect x="200" y="391" width="30" height="4" rx="2" fill="#FFF9D6" opacity=".7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
