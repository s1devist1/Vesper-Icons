<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Brave Origin</title>
  <defs>
    <linearGradient id="back" x1="90" y1="60" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".55" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="shield" x1="100" y1="60" x2="400" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29255F"/>
      <stop offset=".45" stop-color="#1A1850"/>
      <stop offset="1" stop-color="#101045"/>
    </linearGradient>
    <linearGradient id="brow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9E6FF"/>
      <stop offset=".6" stop-color="#BCB8E3"/>
      <stop offset="1" stop-color="#756AA5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D6"/>
      <stop offset=".5" stop-color="#FEEC90"/>
      <stop offset="1" stop-color="#D9B85A"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#FEEC90" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#FEEC90" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D9B85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- back shield, tilted -->
  <g transform="rotate(-8 256 256) translate(-14 -2)">
    <path fill="url(#back)" stroke="#E9E6FF" stroke-width="1.5" stroke-linejoin="round"
          d="M168,60 L256,84 L344,60 L420,132 L396,232 C386,330 330,410 256,456 C182,410 126,330 116,232 L92,132 Z"/>
  </g>

  <!-- front shield -->
  <path fill="url(#shield)" stroke="#756AA5" stroke-width="2" stroke-opacity=".6" stroke-linejoin="round"
        d="M168,60 L256,84 L344,60 L420,132 L396,232 C386,330 330,410 256,456 C182,410 126,330 116,232 L92,132 Z"/>
  <path d="M100,132 L170,66 L256,90" fill="none" stroke="#BCB8E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>

  <!-- brow / mane -->
  <path fill="url(#brow)" opacity=".9"
        d="M256,118 L190,136 L136,132 L146,174 C150,196 162,214 178,226 L196,176 L256,160 L316,176 L334,226 C350,214 362,196 366,174 L376,132 L322,136 Z"/>

  <!-- eyes -->
  <ellipse cx="206" cy="212" rx="34" ry="24" fill="url(#aura)"/>
  <ellipse cx="306" cy="212" rx="34" ry="24" fill="url(#aura)"/>
  <path d="M174,196 L238,210 L228,230 L184,224 Z" fill="url(#amber)"/>
  <path d="M338,196 L274,210 L284,230 L328,224 Z" fill="url(#amber)"/>

  <!-- nose bridge + glowing nose -->
  <path d="M244,176 L268,176 L274,276 L238,276 Z" fill="#756AA5" opacity=".7"/>
  <ellipse cx="256" cy="300" rx="64" ry="44" fill="url(#aura)"/>
  <path d="M220,278 H292 L256,334 Z" fill="#FEEC90" opacity=".5" filter="url(#blur)"/>
  <path d="M220,278 H292 L256,334 Z" fill="url(#amber)" stroke="#FFF9D6" stroke-width="2" stroke-linejoin="round"/>

  <!-- muzzle -->
  <path d="M256,334 V362 M256,362 C238,380 212,376 200,358 M256,362 C274,380 300,376 312,358"
        fill="none" stroke="#BCB8E3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M168,300 C176,330 196,350 214,360 M344,300 C336,330 316,350 298,360"
        fill="none" stroke="#756AA5" stroke-width="6" stroke-linecap="round" opacity=".7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
